name: quiz_show
description: "Create a quiz show with flutter and an arduino connected via usb"
publish_to: 'none'

version: 2.0.0+200

environment:
  sdk: '>3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_native_splash: ^2.2.17
  flutter_launcher_icons: ^0.14.0
  window_manager: ^0.5.1
  shared_preferences: ^2.0.15
  package_info_plus: ^9.0.0
  url_launcher: ^6.2.1
  mesh_gradient: ^1.3.8

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.13

#flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icon/icon_transparent.png"
  adaptive_icon_background: "#732E00"
  web:
    generate: true
    background_color: "#732E00"
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true

#dart run msix:create
msix_config:
  display_name: Quiz Studio
  publisher_display_name: Equirinya
  identity_name: de.equirinya.quizshow
  msix_version: 2.0.0.0
  logo_path: assets/icon/icon.png
  capabilities: internetClient, microphone, serialcommunication

#flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#732E00"
  image: assets/icon/icon.png
  android_12:
    image: assets/icon/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
