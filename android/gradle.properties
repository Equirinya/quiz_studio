org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Retry downloads that fail with a server error (e.g. 504 from GitHub's
# release servers) more often and with longer pauses than the default 3.
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=2000
