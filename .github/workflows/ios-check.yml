# Builds the iOS app without signing, to show that the project, the pods and
# the Dart code still build for iOS. Needs no secrets; ios.yml does the
# signed release build and the upload.

name: iOS build check

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'third_party/**'
      - '.github/workflows/ios-check.yml'

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # The firebase submodule is private and not needed to build the app.
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ vars.FLUTTER_VERSION || 'latest' }}

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - run: flutter pub get

      - name: Build for iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Show what pod install changed in the Xcode project
        if: always()
        run: git status --short ios && git diff --stat ios
