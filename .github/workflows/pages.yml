# Publishes docs/ (terms, privacy, account deletion and the open.html page
# behind QR codes and invites) to GitHub Pages, and under app/ the web app
# for teams' devices (lib/main_web.dart): joining a show and playing along
# in a browser, e.g. drawing with an Apple Pencil on an iPad.
#
# Runs when docs/, the app or this workflow change on master, or by hand. It
# checks out without submodules: the firebase submodule is private, and
# GitHub's built-in Pages build fails trying to clone it. Settings -> Pages
# -> Source must be "GitHub Actions" for this workflow to be used.
name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs/
          destination: ./_site

      # Jekyll writes _site as root inside its container.
      - name: Make the site writable
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Set up Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        env:
          FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION }}
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}

      - name: Build the web app for teams' devices
        run: |
          flutter pub get
          flutter build web --release -t lib/main_web.dart --base-href /${{ github.event.repository.name }}/app/
          cp -r build/web _site/app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
